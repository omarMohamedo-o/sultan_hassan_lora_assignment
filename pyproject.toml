[project]
name = "sultan-hassan-flux"
version = "0.1.0"
description = "Production ML Pipeline for Sultan Hassan Mosque Dataset Curation and FLUX LoRA"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Omar", email = "omar@example.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.3.0",
    "imagehash>=4.3.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "pillow-heif>=1.8.0",
    "safetensors>=0.8.0",
    "onnx>=1.23.0",
    "mlflow>=3.16.1",
    "accelerate>=1.15.0",
    "transformers>=5.17.0",
    "diffusers>=0.40.0",
    "peft>=0.21.0",
    "datasets>=5.0.1",
    "torchvision>=0.29.0",
    "bitsandbytes>=0.50.2",
    "wandb>=0.30.0",
    "torchao>=0.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "pyright>=1.1.360",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sultan_hassan"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.pyright]
include = ["src", "tests", "scripts", "main.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
